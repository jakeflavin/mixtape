    <!--
      Resolves the ground before the first paint. An invite's look rides in the link as
      `t`, because the full document is a compressed blob this script cannot afford to
      unpack. The grounds below are copies of lib/themes.ts — the same numbers, and
      changing either changes both. Without this a jazz invite paints cream for a frame
      before going navy, which is the first thing every guest would see.
    -->
    <script>
      try {
        var grounds = {
          indie: ['#f4f1e8', '#2d2a22', 'light'],
          rock: ['#141212', '#f2eeea', 'dark'],
          pop: ['#fdeef4', '#3b1226', 'light'],
          hiphop: ['#101010', '#f5f1e6', 'dark'],
          country: ['#f5ecdd', '#3a2b1a', 'light'],
          jazz: ['#101623', '#eef0ea', 'dark'],
          classical: ['#f8f5ee', '#2c2418', 'light'],
          electronic: ['#0b0e14', '#e8f4ff', 'dark'],
          punk: ['#f4f2ef', '#151312', 'light'],
          disco: ['#170f22', '#f6effc', 'dark'],
        }
        var query = new URLSearchParams(location.search)
        var fragment = new URLSearchParams(location.hash.slice(1))
        var theme = fragment.get('t') || query.get('t')
        var blob = fragment.get('m') || query.get('m')
        var editing = (fragment.get('edit') || query.get('edit')) === '1'
        var ground = grounds[theme]
        var root = document.documentElement
        if (ground && blob && !editing) {
          root.style.setProperty('--bg', ground[0])
          root.style.setProperty('--text', ground[1])
          root.style.colorScheme = ground[2]
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          root.dataset.theme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
